name: Update orkestar

on:
  schedule:
    - cron: "42 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-orkestar

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Remove unrelated runner tap
        shell: bash
        run: brew untap aws/tap || true
      - uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869
        with:
          core: false
          cask: false
          token: ${{ github.token }}
      - name: Read latest release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Anonymous api.github.com calls share the runner's IP allowance and
          # get 403ed. Reading the body into a variable first also means a
          # failed request reports curl's error instead of a JSON parse error
          # against an empty string.
          release=$(curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/LibreCollab/orkestar/releases/latest)
          tag=$(printf '%s' "$release" | ruby -rjson -e 'puts JSON.parse(STDIN.read).fetch("tag_name")')
          if [ -z "$tag" ]; then
            echo "The latest release of orkestar has no tag_name." >&2
            exit 1
          fi
          version="${tag#v}"
          url="https://github.com/LibreCollab/orkestar/archive/refs/tags/${tag}.tar.gz"
          sha=$(curl --fail --location --silent --show-error "$url" | shasum -a 256 | cut -d' ' -f1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Update formula
        shell: bash
        env:
          URL: ${{ steps.release.outputs.url }}
          SHA: ${{ steps.release.outputs.sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          ruby -e '
            path = "Formula/orkestar.rb"
            formula = File.read(path)
            formula.sub!(/^  url ".*"$/, "  url \"#{ENV.fetch("URL")}\"")
            formula.sub!(/^  sha256 ".*"$/, "  sha256 \"#{ENV.fetch("SHA")}\"")
            File.write(path, formula)
          '
          if git diff --quiet -- Formula/orkestar.rb; then
            echo "Formula already targets ${VERSION}."
            exit 0
          fi
          brew audit --strict librecollab/tap/orkestar
          brew install --build-from-source librecollab/tap/orkestar
          brew test librecollab/tap/orkestar
      - name: Commit update
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if git diff --quiet -- Formula/orkestar.rb; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/orkestar.rb
          git commit -m "update orkestar to ${VERSION}"
          # actions/checkout does not set a tracking branch, so a bare push
          # fails with "no upstream branch".
          git push origin "HEAD:${GITHUB_REF_NAME}"
